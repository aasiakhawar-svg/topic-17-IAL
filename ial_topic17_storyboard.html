return s+'<text x="55" y="116" text-anchor="middle">monodentate</text><text x="170" y="116" text-anchor="middle">bidentate (en)</text><text x="295" y="116" text-anchor="middle">hexadentate (EDTA⁴⁻)</text></svg><div class="btns"><button data-a="ent" data-k="1">▶ [Cu(H₂O)₆]²⁺ + 3 en → [Cu(en)₃]²⁺ + 6 H₂O</button></div><div id="ent"></div>'}
function v7(){var B=['Start: [Cu(H₂O)₆]²⁺','+ NaOH(aq)','+ excess NH₃(aq)','+ conc. HCl (some)','+ conc. HCl (excess)'];return '<div class="row" style="align-items:flex-start"><svg viewBox="0 0 120 150" width="120"><path id="lq" d="M37 40V120a23 23 0 0 0 46 0V40Z" style="transition:fill .8s" fill="#58b6e8"/><g id="pp" style="opacity:0;transition:opacity .8s" fill="#2b8ad0"><circle cx="50" cy="128" r="6"/><circle cx="68" cy="136" r="7"/><circle cx="78" cy="122" r="5"/><circle cx="58" cy="114" r="5"/><circle cx="72" cy="108" r="4"/></g><path d="M35 10V120a25 25 0 0 0 50 0V10" fill="none" stroke="currentColor" stroke-width="3"/></svg><div class="btns" style="flex-direction:column;flex:1;min-width:200px">'+B.map(function(b,i){return '<button'+(i?'':' class="on"')+' data-a="tube" data-k="'+i+'">'+b+'</button>'}).join('')+'</div></div><div id="tinfo"></div>'}
var F={fe:function(k){var s=[{d:[2,1,1,1,1],s:2,c:'[Ar] 3d⁶ 4s²'},{d:[2,1,1,1,1],s:0,c:'[Ar] 3d⁶ — the 4s electrons are lost first'},{d:[1,1,1,1,1],s:0,c:'[Ar] 3d⁵ — half-filled'}][k];$('#fe').innerHTML='<b>3d</b> '+s.d.map(bx).join('')+' &nbsp; <b>4s</b> '+bx(s.s)+'<div class="eq">'+s.c+'</div>'},
ion:function(k){var I=[{n:'Cu²⁺',d:'d⁹',j:1,a:'red light (low energy)',s:'blue',p:8,c:'#e11'},{n:'Fe³⁺',d:'d⁵',j:1,a:'blue/violet light (higher energy)',s:'yellow',p:88,c:'#82b'},{n:'Zn²⁺',d:'d¹⁰',j:0,t:'3d is full: no empty space to promote an electron'},{n:'Sc³⁺',d:'d⁰',j:0,t:'3d is empty: no electron to promote'}][k];$('#sp').setAttribute('class',I.j?'jump':'');$('#mk').style.display=I.j?'block':'none';if(I.j){$('#mk').style.left=I.p+'%';$('#ph path').setAttribute('stroke',I.c)}
$('#ioninfo').innerHTML='<b>'+I.n+'</b> ('+I.d+'): '+(I.j?'an electron is promoted by absorbing '+I.a+' → appears <b>'+I.s+'</b> (complementary colour)':I.t+' → <b>colourless</b>')},
ent:function(){var d=function(n,c){var s='';for(var i=0;i<n;i++)s+='<i class="dt" style="background:'+c+';animation-delay:'+i*.15+'s"></i>';return s};$('#ent').innerHTML='<div class="row"><span>before: <b>4</b> particles</span>'+d(1,'#2b6fbb')+d(3,'#e8590c')+'</div><div class="row"><span>after: <b>7</b> particles</span>'+d(1,'#7048e8')+d(6,'#4aa8e0')+'</div><div class="eq">More particles → ΔS<sub>system</sub> increases → products favoured (more stable complex)</div>'},
tube:function(k){var T=[['#58b6e8',0,'pale blue solution','','Starting complex: octahedral, coordination number 6'],['#d4ecf8',1,'pale blue precipitate','[Cu(H₂O)₆]²⁺ + 2OH⁻ → [Cu(H₂O)₄(OH)₂] + 2H₂O','DEPROTONATION: OH⁻ removes H⁺ from two water ligands'],['#1d2b8f',0,'deep blue solution','[Cu(H₂O)₄(OH)₂] + 4NH₃ → [Cu(NH₃)₄(H₂O)₂]²⁺ + 2H₂O + 2OH⁻','LIGAND EXCHANGE: NH₃ replaces two H₂O and two OH⁻'],['#2fae5b',0,'green solution (blue and yellow complexes mixed)','[Cu(H₂O)₆]²⁺ + 4Cl⁻ ⇌ [CuCl₄]²⁻ + 6H₂O','The reaction is reversible, so a mixture forms'],['#e9e232',0,'yellow solution','[Cu(H₂O)₆]²⁺ + 4Cl⁻ ⇌ [CuCl₄]²⁻ + 6H₂O','LIGAND EXCHANGE + CHANGE IN COORDINATION NUMBER (6 → 4); oxidation number unchanged']][k];$('#lq').setAttribute('fill',T[0]);$('#pp').style.opacity=T[1];$('#tinfo').innerHTML='<b>'+T[2]+'</b><div class="eq">'+T[3]+'</div>'+T[4]}};
var CH=[
{t:'Transition metal electron configurations',sp:'17A.1',v:v1,x:['Transition metals are <b>d-block elements that form one or more stable ions with incompletely filled d-orbitals</b>. In Period 4 that is Ti to Cu: Sc (only Sc³⁺, 3d⁰) and Zn (only Zn²⁺, 3d¹⁰) are d-block but <b>not</b> transition metals.','Atoms fill 4s before 3d, but <b>ions lose 4s electrons first</b>. Cr ([Ar]3d⁵4s¹) and Cu ([Ar]3d¹⁰4s¹) are the irregular ones. Because 4s and 3d electrons have similar energies, different numbers can be lost, giving <b>variable oxidation numbers</b>.'],
q:[['Which Period 4 d-block elements are NOT transition metals?',['Ti and Cu','Sc and Zn','Cr and Mn','Fe and Ni'],1,'Sc forms only Sc³⁺ (3d⁰) and Zn only Zn²⁺ (3d¹⁰): neither ion has an incompletely filled d-subshell.'],['What is the electronic configuration of Fe²⁺?',['[Ar] 3d⁶ 4s²','[Ar] 3d⁴ 4s²','[Ar] 3d⁶','[Ar] 3d⁵'],2,'The 4s electrons are lost first, so Fe ([Ar]3d⁶4s²) becomes [Ar]3d⁶.']]},
{t:'Ligands and complexes',sp:'17A.2',v:v2,x:['A <b>ligand</b> is a species with a lone pair that forms a <b>dative (coordinate) covalent bond</b> to a metal ion. A <b>complex ion</b> is a central metal ion surrounded by ligands, and the <b>coordination number</b> is the number of dative bonds.','Naming order: number of ligands, ligand name, metal, oxidation number. Negative ligands end in -o, and a negative complex takes “-ate” (often the Latin name, e.g. ferrate).'],
q:[['What is the coordination number of [Fe(H₂O)₆]²⁺?',['2','6','4','12'],1,'Six water ligands form six dative bonds.'],['Name [FeCl₄]⁻.',['tetrachloroiron(III)','tetrachloroferrate(II)','tetrachloroferrate(III)','hexachloroferrate(III)'],2,'Four Cl⁻ and an overall charge of 1− means Fe is +3. A negative complex takes “-ate” and the Latin name.']]},
{t:'The origin of colour in complexes',sp:'17A.3',v:v3,x:['Ligands <b>split the 3d orbitals</b> into two energy levels. An electron can be <b>promoted</b> to the higher level by absorbing visible light with energy ΔE = hν. The light that emerges is the <b>complementary colour</b> of the light absorbed.','If the 3d sub-level is <b>empty (Sc³⁺) or full (Zn²⁺)</b>, no promotion is possible, so the ion is colourless. Changing the ligand changes ΔE and therefore the colour.'],
q:[['Why is aqueous Zn²⁺ colourless?',['Its 3d sub-level is full, so no d–d promotion is possible','It has no d electrons','It absorbs all visible light','Its 4s orbital is full'],0,'Zn²⁺ is 3d¹⁰: there is no empty space for an electron to be promoted.'],['A complex absorbs red light. It will look…',['red','blue/green','colourless','black'],1,'The emerging light is richer in the complementary colour, which is opposite red on the colour wheel.'],['Replacing H₂O ligands by NH₃ changes the colour because…',['ligands change the gap between the split d-levels','the metal loses its 4s electrons','the oxidation number always rises','light stops being absorbed'],0,'A different ligand changes ΔE, so a different wavelength is absorbed.']]},
{t:'Common shapes of complexes',sp:'17A.4',v:v4,x:['Use electron-pair repulsion: count the electron pairs donated by the ligands and ignore the 3d electrons. <b>6 ligands → octahedral (90°)</b> (H₂O, NH₃, OH⁻); <b>4 → tetrahedral (109.5°)</b>, typical of large Cl⁻ ions; <b>2 → linear (180°)</b>, e.g. in Tollens’ reagent.'],
q:[['Why is [CuCl₄]²⁻ tetrahedral rather than octahedral?',['Cl⁻ is a large ion, so only four fit around Cu²⁺','Cl⁻ has no lone pair','Cu²⁺ has no d electrons','Cl⁻ is neutral'],0,'Chloride ions are Period 3 ions, much bigger than H₂O or NH₃, so six will not fit.'],['[Co(NO₂)₆]³⁻ has NO₂⁻ ligands. Predict the shape and the oxidation number of Co.',['octahedral, +3','tetrahedral, +3','octahedral, +2','linear, +6'],0,'Six ligands → octahedral. 6(−1) + x = −3, so x = +3.']]},
{t:'Square planar complexes',sp:'17A.5',v:v5,x:['Four ligands lie in one plane with bond angles of 90°. [Pt(NH₃)₂Cl₂] shows <b>cis–trans isomerism</b>: in <b>cis</b> the identical ligands are adjacent, in <b>trans</b> they are opposite.','<b>cis-platin</b> bonds between the two strands of DNA and stops cancer cells dividing. trans-platin is much less effective and more toxic, so only the cis isomer is used.'],
q:[['In cis-platin, the two NH₃ ligands are…',['opposite each other','next to each other','above and below the plane','replaced by Cl⁻'],1,'cis means identical ligands are adjacent; trans means opposite.'],['Why is only cis-platin used to treat cancer?',['trans-platin is colourless','cis can bond between DNA strands; trans is less effective and more toxic','cis-platin is octahedral','trans-platin contains no platinum'],1,'The cis structure lets it bond between the two DNA strands and block cell division.']]},
{t:'Multidentate ligands',sp:'17A.6',v:v6,x:['<b>Monodentate</b> ligands (H₂O, NH₃, Cl⁻) donate one lone pair, <b>bidentate</b> ligands such as 1,2-diaminoethane (en) donate two, and <b>hexadentate</b> EDTA⁴⁻ donates six. Replacing monodentate ligands by bidentate or hexadentate ones releases more free particles, so ΔS<sub>system</sub> increases and the complex is more stable.','In <b>haemoglobin</b>, Fe²⁺ binds O₂ reversibly. CO forms a much stronger dative bond to Fe²⁺ and is not easily displaced, so it blocks oxygen transport.'],
q:[['Which is a bidentate ligand?',['H₂O','NH₃','NH₂CH₂CH₂NH₂','Cl⁻'],2,'1,2-diaminoethane has two N atoms, each with a lone pair to donate.'],['Why is [Cu(en)₃]²⁺ favoured when en replaces 6 H₂O ligands?',['4 particles become 7, so ΔS_system rises','the oxidation number rises','fewer bonds form','the charge changes'],0,'More free particles means more disorder and a more stable complex.'],['Why is carbon monoxide poisonous?',['It oxidises Fe²⁺ to Fe³⁺','It forms a much stronger dative bond to haemoglobin than O₂','It breaks up the globin protein','It makes haemoglobin bidentate'],1,'CO replaces O₂ at Fe²⁺, and the carboxyhaemoglobin bond is not easily broken.']]},
